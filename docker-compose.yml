services:
  # C++ Server Service
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    volumes:
      - ./data:/usr/src/app/data
    # Default argument passed to the server's main function
    command: ["${PORT:-8080}"]

  # Python Client Service
  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    # Do not auto-start the server when running the client.
    # The client should fail if the server is not already active.
    stdin_open: true
    tty: true
    # Default arguments: [server_address] [port]
    command: ["${SERVER_IP:-server}", "${PORT:-8080}"]
  