services:
  # C++ Server Service
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    volumes:
      - ./data:/usr/src/app/data
    # Default argument passed to the server's main function
    command: ["${PORT:-8080}"]

  # Python Client Service
  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    # Do not auto-start the server when running the client.
    # The client should fail if the server is not already active.
    stdin_open: true
    tty: true
    # Default arguments: [server_address] [port]
    command: ["${SERVER_IP:-server}", "${PORT:-8080}"]

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "${WEB_PORT:-3000}:${WEB_PORT:-3000}"
    environment:
    # The internal port where Express will listen
      - PORT=${WEB_PORT:-3000}
    # The host/IP address of the C++ server
      - CPP_SERVER_HOST=${SERVER_IP:-server}
    # The port of the C++ server
      - CPP_SERVER_PORT=${PORT:-8080}
    depends_on:
      - server

  # React Frontend Client Service (New Sub-task implementation)
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      # Bind mount the client directory for instant live-reload updates during development
      - ./client:/app
      # Anonymous volume to protect the container's node_modules from being overwritten by the host
      - /app/node_modules
    depends_on:
      - web
  