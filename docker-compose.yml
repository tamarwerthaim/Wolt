services:
  # C++ Server Service
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    volumes:
      - ./data:/usr/src/app/data
    # Default argument passed to the server's main function
    command: ["${PORT:-8080}"]

  # Python Client Service
  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    depends_on:
      - server
    # Allows interactive command input from the terminal
    stdin_open: true
    tty: true
    # Default arguments: [server_address] [port]
    command: ["server", "${PORT:-8080}"]
    environment:
      - SERVER_HOST=server
      - SERVER_PORT=${PORT:-8080}
